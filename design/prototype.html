<title>ARAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap">
<style>
/* Layout: black and white only. Light = printed exam sheet, dark = monochrome terminal.
   One primary action per screen, back arrow in the header, everything else in bottom sheets. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#000000; --accent:#000000; --muted:#666666; --rule:#D6D6D6;
  --on-accent:#FFFFFF; --hatch:repeating-linear-gradient(135deg,rgba(0,0,0,.16) 0 1.5px,transparent 1.5px 6px);
  --scan:transparent; --glow-text:none; --glow-box:none;
  --display:"VT323","Courier New",monospace;
  --body:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  --t-xs:11px; --t-sm:13px; --t-md:15px; --t-lg:clamp(17px,1.9vw,21px); --t-h1:clamp(40px,7vw,72px);
  --gut:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0A0A0A; --fg:#FFFFFF; --accent:#FFFFFF; --muted:#9C9C9C; --rule:#2C2C2C;
    --on-accent:#000000; --hatch:repeating-linear-gradient(135deg,rgba(255,255,255,.24) 0 1.5px,transparent 1.5px 6px);
    --scan:rgba(0,0,0,.28); --glow-text:0 0 8px rgba(255,255,255,.35); --glow-box:0 0 12px rgba(255,255,255,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0A0A0A; --fg:#FFFFFF; --accent:#FFFFFF; --muted:#9C9C9C; --rule:#2C2C2C;
  --on-accent:#000000; --hatch:repeating-linear-gradient(135deg,rgba(255,255,255,.24) 0 1.5px,transparent 1.5px 6px);
  --scan:rgba(0,0,0,.28); --glow-text:0 0 8px rgba(255,255,255,.35); --glow-box:0 0 12px rgba(255,255,255,.12);
  color-scheme:dark;
}
@media (min-width:700px){ :root{ --gut:32px } }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:var(--t-md);line-height:1.5;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(to bottom,transparent 0 2px,var(--scan) 2px 3px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--on-accent)}
p{margin:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
svg.i .f{fill:currentColor;stroke:none}

#app{min-height:100%;display:flex;flex-direction:column}
body.fit #app{height:100%}
.wrap{width:100%;max-width:1080px;margin-inline:auto;padding-inline:var(--gut)}
main.wrap{flex:1;padding-block:24px 64px}
body.fit main.wrap{display:flex;flex-direction:column;min-height:0;padding-block:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--accent)}
.top-in{display:flex;align-items:center;gap:8px;min-height:56px}
.logo{font-size:var(--t-sm);letter-spacing:.14em;text-transform:uppercase;font-weight:600;text-shadow:var(--glow-text)}
.top-title{font-size:var(--t-sm);letter-spacing:.1em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .icon-btn:last-child{margin-left:auto}
body.fit .top{display:none}

/* buttons */
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;flex:none;border:0;background:transparent;cursor:pointer;color:var(--fg)}
.icon-btn:hover{background:var(--accent);color:var(--on-accent)}
.icon-btn.boxed{border:1px solid var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border:1px solid var(--accent);background:transparent;color:var(--fg);
  font-size:var(--t-sm);font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow-box)}
.btn.primary:hover:not(:disabled){background:var(--bg);color:var(--fg)}
.btn.ghost{border-color:transparent}
.btn.big{min-height:54px;padding-inline:22px;font-size:var(--t-md)}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:420px){ .hide-xs{display:none} }

/* type */
.h1{font-family:var(--display);font-size:var(--t-h1);font-weight:400;line-height:.9;margin:0;letter-spacing:.04em;text-transform:uppercase;text-shadow:var(--glow-text);text-wrap:balance;overflow-wrap:anywhere}
.sec{font-family:var(--display);font-size:26px;font-weight:400;margin:0;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.hl{background:var(--accent);color:var(--on-accent);padding:0 .25em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.label{font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sub{font-size:12px;font-weight:400;color:var(--muted)}
.ascii{overflow:hidden;white-space:nowrap;font-family:var(--display);font-size:24px;line-height:1;margin-block:28px;user-select:none;text-shadow:var(--glow-text)}
.bar{font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
.bar .n{color:var(--muted)}

/* page head */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}

/* list rows */
.list{border-top:1px solid var(--accent)}
.lr{display:grid;align-items:center;gap:6px 16px;width:100%;padding:14px 8px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;color:var(--fg);font-size:var(--t-sm);font-variant-numeric:tabular-nums}
button.lr{cursor:pointer}
button.lr:hover{background:var(--accent);color:var(--on-accent)}
button.lr:hover .muted,button.lr:hover .sub,button.lr:hover .bar .n{color:inherit}
.lr .t{font-size:var(--t-md);font-weight:500;min-width:0;overflow-wrap:anywhere}
.r-rev{grid-template-columns:minmax(0,1fr) auto auto 20px}
.r-file{grid-template-columns:20px minmax(0,1fr) auto}
.r-exam{grid-template-columns:minmax(0,1fr) auto auto 20px}
.score-pill{font-weight:600}
@media (max-width:640px){
  .r-rev{grid-template-columns:minmax(0,1fr) auto 20px}
  .r-rev>.prog-cell{grid-column:1;grid-row:2}
  .r-rev>.score-pill{grid-row:1/3;grid-column:2}
  .r-rev>svg{grid-row:1/3;grid-column:3}
  .r-file>.prog-cell{grid-column:2;grid-row:2}
}
.empty{border:1px dashed var(--rule);padding:22px;text-align:center;color:var(--muted)}

/* reviewer */
.rv-head{display:grid;gap:14px;margin-bottom:8px}
.cov{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:var(--t-sm)}
.cov .bar{font-size:18px;letter-spacing:.06em}
.rv-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.rv-actions .btn.primary{flex:1 1 220px;max-width:360px}
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;margin-top:4px}
@media (max-width:820px){ .rv-grid{grid-template-columns:1fr;gap:30px} }
.wait{display:flex;gap:8px;align-items:center;font-size:var(--t-sm);color:var(--muted);margin-top:8px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 72%,transparent);display:grid;align-items:end}
@media (min-width:700px){ .scrim{place-items:center} }
.sheet{background:var(--surface);border:1px solid var(--accent);width:min(520px,100%);max-height:88vh;overflow:auto;padding:16px var(--gut) calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;box-shadow:var(--glow-box)}
@media (min-width:700px){ .sheet{padding:20px 24px 24px} }
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1;letter-spacing:.04em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.field{display:grid;gap:8px}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.type{display:grid;gap:6px;justify-items:center;padding:14px 6px;border:1px solid var(--accent);background:transparent;cursor:pointer;color:var(--fg);text-align:center}
.type .g{font-family:var(--display);font-size:28px;line-height:1;letter-spacing:.06em}
.type .n{font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase}
.type[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow-box)}
.type[aria-pressed="false"]{border-style:dashed;color:var(--muted)}
.count-row{display:flex;align-items:center;gap:14px}
.stepper{display:flex;border:1px solid var(--accent)}
.stepper button{width:52px;border:0;background:none;cursor:pointer;color:var(--fg);display:grid;place-items:center}
.stepper button:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper input{width:76px;border:0;border-inline:1px solid var(--accent);background:transparent;text-align:center;font-family:var(--display);font-size:36px;padding:2px 0;appearance:textfield;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{appearance:none;margin:0}
details.more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:var(--t-sm);letter-spacing:.06em;text-transform:uppercase;min-height:40px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary svg{transform:rotate(90deg)}
.scope{display:grid;gap:12px;padding:6px 0 0 4px}
.sf{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:var(--t-sm)}
.sf input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.range{grid-column:2;display:flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--muted)}
.range input{width:56px;min-height:34px;border:1px dashed var(--accent);background:transparent;text-align:center;padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--accent);background:none;padding:6px 10px;min-height:34px;cursor:pointer;font-size:var(--t-xs);color:var(--fg)}
.chip[aria-pressed="true"]{border-style:solid;background:var(--accent);color:var(--on-accent)}
.drop{display:grid;place-items:center;gap:8px;width:100%;padding:28px 12px;border:1px dashed var(--accent);background:transparent;cursor:pointer;color:var(--fg)}
.drop:hover{background:var(--hatch)}
.drop b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.06em;text-transform:uppercase}
.drop svg.i{width:28px;height:28px}
.up{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:var(--t-sm);padding:8px 0;border-bottom:1px solid var(--rule)}
.input{width:100%;min-height:48px;border:1px solid var(--accent);background:transparent;padding:8px 12px;font-size:var(--t-md)}
.fine{font-size:var(--t-xs);color:var(--muted)}
.menu{display:grid;border-top:1px solid var(--accent)}
.menu button{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 6px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;color:var(--fg);font-size:var(--t-md)}
.menu button:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.menu button:disabled{opacity:.35;cursor:not-allowed}
.menu button span.muted{margin-left:auto;font-size:var(--t-xs);text-align:right}
.menu button:hover span.muted{color:inherit}

/* generating */
.gen{flex:1;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;min-height:60vh}
.gen .h1{font-size:clamp(36px,6vw,60px)}
.gen .bar{font-size:22px}

/* flashcards */
.cardbar{display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:1px solid var(--accent);margin-inline:calc(var(--gut)*-1);padding-inline:max(8px,calc(var(--gut) - 8px));padding-top:env(safe-area-inset-top,0px)}
.cardbar .prog{flex:1;text-align:center;font-size:var(--t-sm);font-variant-numeric:tabular-nums;text-shadow:var(--glow-text)}
.fc{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 230px;grid-template-rows:minmax(0,1fr);gap:28px;padding-top:16px}
.fc-main{display:flex;flex-direction:column;min-height:0}
.card{flex:1;min-height:0;overflow:auto;border:1px solid var(--accent);background:var(--surface);padding:clamp(16px,3vw,30px);box-shadow:var(--glow-box);overscroll-behavior:contain}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.qtype{font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase}
.qnum{font-family:var(--display);font-size:32px;line-height:1;text-shadow:var(--glow-text)}
.qprompt{font-size:var(--t-lg);line-height:1.5;margin:0 0 22px;max-width:62ch}
.qprompt strong{font-weight:600;text-decoration:underline;text-underline-offset:4px}
.choices{border-top:1px solid var(--rule)}
.choice{display:grid;grid-template-columns:28px minmax(0,1fr) 22px;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 10px;min-height:54px;border:0;border-bottom:1px solid var(--rule);background:transparent;cursor:pointer;color:var(--fg)}
.choice .key{display:grid;place-items:center;width:28px;height:28px;border:1px solid currentColor;font-size:var(--t-sm);font-weight:600}
.choice:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.choice:disabled{cursor:default}
.choice.is-correct{background:var(--accent);color:var(--on-accent)}
.choice.is-wrong{background:var(--hatch);color:var(--fg)}
.choice.is-dim{opacity:.45}
.choice .mark{display:grid;place-items:center}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfb{display:grid;place-items:center;min-height:96px;border:1px solid var(--accent);background:transparent;cursor:pointer;color:var(--fg);font-family:var(--display);font-size:40px;letter-spacing:.08em;text-transform:uppercase}
.tfb:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.tfb:disabled{cursor:default}
.tfb.is-correct{background:var(--accent);color:var(--on-accent)}
.tfb.is-wrong{background:var(--hatch)}
.tfb.is-dim{opacity:.4}
.ident{display:flex;gap:8px;flex-wrap:wrap}
.pinput{flex:1 1 220px;display:flex;align-items:center;gap:10px;border:1px dashed var(--accent);padding:0 14px;min-height:54px}
.pinput::before{content:">";font-weight:600}
.pinput input{flex:1;min-width:0;border:0;background:transparent;font-size:var(--t-lg);padding:10px 0;outline:none}
.pinput:focus-within{border-style:solid}
.pinput.is-correct{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.pinput.is-wrong{border:1px solid var(--accent);background:var(--hatch)}
.ident .btn{min-height:54px}
.fb{margin-top:22px;padding-top:18px;border-top:1px dashed var(--accent);display:grid;gap:12px;max-width:64ch;scroll-margin-top:12px}
.fb:focus{outline:none}
.vline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.verdict{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:30px;line-height:1;padding:4px 12px 3px;letter-spacing:.06em;text-transform:uppercase}
.verdict.ok{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow-box)}
.verdict.bad{background:var(--hatch);outline:1px solid var(--accent);outline-offset:-1px}
.vline b{font-weight:600}
.diff{font-size:var(--t-sm)}
.diff del{text-decoration-thickness:2px}
.diff ins{background:var(--accent);color:var(--on-accent);text-decoration:none;padding:0 .25em}
.why2{font-size:var(--t-sm);color:var(--muted)}
details.src summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:32px}
details.src summary::-webkit-details-marker{display:none}
details.src summary svg{width:14px;height:14px}
details.src[open] summary svg{transform:rotate(90deg)}
details.src blockquote{margin:6px 0 0;padding:12px 14px;border:1px solid var(--rule);background:var(--bg);font-size:var(--t-sm)}
.fc-actions{display:flex;gap:10px;align-items:center;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.fc-actions .grow{flex:1}
.fc-actions .next{min-width:140px}
.fc-side{display:grid;gap:16px;align-content:start;overflow:auto;min-height:0;padding-bottom:12px}
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;display:grid;place-items:center;border:1px dashed var(--muted);background:transparent;cursor:pointer;font-size:var(--t-sm);font-variant-numeric:tabular-nums;color:var(--fg)}
.cell.c-ok{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent)}
.cell.c-bad{background:var(--hatch);border:1px solid var(--accent)}
.cell.c-cur{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:var(--t-xs);color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border:1px solid var(--accent);vertical-align:-1px;margin-right:4px}
.legend i.ok{background:var(--accent)} .legend i.bad{background:var(--hatch)} .legend i.un{border-style:dashed;border-color:var(--muted)}
.phone-only{display:none !important}
@media (max-width:899px){
  .fc{grid-template-columns:1fr}
  .fc-side{display:none}
  .phone-only{display:inline-grid !important}
}

/* results */
.score{font-family:var(--display);font-size:clamp(96px,18vw,170px);line-height:.78;text-shadow:var(--glow-text);font-variant-numeric:tabular-nums;margin-top:6px}
.score span{font-size:.42em;color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px}
.strip i{width:18px;height:18px;border:1px solid var(--accent)}
.strip i.ok{background:var(--accent)} .strip i.bad{background:var(--hatch)} .strip i.un{border-style:dashed;border-color:var(--muted)}
.res-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:28px}
@media (max-width:640px){ .res-actions{grid-template-columns:1fr} }
.res-actions .btn{min-height:58px}
.review{border-top:1px solid var(--accent)}
.review details{border-bottom:1px solid var(--rule)}
.review summary{display:grid;grid-template-columns:22px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:12px 6px;cursor:pointer;list-style:none;font-size:var(--t-sm)}
.review summary::-webkit-details-marker{display:none}
.review summary:hover{background:var(--hatch)}
.review details[open] summary>svg:last-child{transform:rotate(90deg)}
.review .body{padding:2px 6px 16px 40px;display:grid;gap:8px;font-size:var(--t-sm);max-width:68ch}
.review .body b{font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--accent);color:var(--on-accent);padding:10px 14px;font-size:var(--t-sm);width:max-content;max-width:calc(100% - 32px);box-shadow:var(--glow-box)}
.foot{margin-top:48px;font-size:var(--t-xs);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;scroll-behavior:auto !important} }
</style>

<div id="app">
  <header class="top"><div class="wrap top-in" id="topbar"></div></header>
  <main class="wrap" id="view"></main>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ---------------- icons ---------------- */
const P={
  back:'<path d="M15 5l-7 7 7 7"/>', next:'<path d="M5 12h14M13 6l6 6-6 6"/>', prev:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  chev:'<path d="M9 5l7 7-7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  play:'<path class="f" d="M7 4l13 8-13 8z"/>', check:'<path d="M5 12l5 5 9-10"/>',
  restart:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/>',
  retry:'<rect x="4" y="4" width="16" height="16"/><path d="M9 9l6 6M15 9l-6 6"/>',

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,"").replace(/\s+/g," ").trim().replace(/^(the|a|an) /,"");
function ratio(a,b){const m=a.length,n=b.length;if(!m&&!n)return 1;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return 1-p[n]/Math.max(m,n)}
function bar(a,t,slots=10){const f=t?Math.round(a/t*slots):0;return `<span class="bar" aria-hidden="true">${"■".repeat(f)}<span class="n">${"·".repeat(slots-f)}</span></span>`}

function maxItems(){const r=rv(),o=S.opt;let u=0,d=0;r.files.forEach(f=>{const F=FILES[f];if(F.status!=="ready")return;const sf=o.files[f]||{on:true};if(!sf.on)return;
  let uu=F.items-F.used,dd=Math.round(F.defs*uu/Math.max(F.items,1));
  if(sf.from||sf.to){const a=Math.max(1,+sf.from||1),b=Math.min(F.pages,+sf.to||F.pages),k=Math.max(0,b-a+1)/F.pages;uu=Math.round(uu*k);dd=Math.round(dd*k)}
  if(o.topics.size){const ts=r.topics.filter(t=>t[1]===f&&o.topics.has(t[0])).reduce((x,t)=>x+t[2],0);dd=Math.round(dd*ts/Math.max(uu,1));uu=Math.min(uu,ts)}
  u+=uu;d+=dd});
  if(!o.types.size)return 0;return o.types.size===1&&o.types.has("ident")?d:u}

/* attempts */
function newAttempt(ids,kind){const order=shuffle(ids),co={};order.forEach(id=>{if(Q[id].type==="mcq")co[id]=shuffle(Q[id].choices.map(c=>c.id))});return{kind,order,co,ans:{},idx:0,done:false}}
const cur=()=>{const A=S.attempt;return[A.order[A.idx],Q[A.order[A.idx]]]};
function tally(A){let ok=0,bad=0;Object.values(A.ans).forEach(a=>a.ok?ok++:bad++);return{ok,bad,done:ok+bad,total:A.order.length,un:A.order.length-ok-bad}}
function firstOpen(A,from=0){const n=A.order.length;for(let k=0;k<n;k++){const i=(from+k)%n;if(!A.ans[A.order[i]])return i}return -1}
function grade(id,resp){const q=Q[id];
  if(q.type==="mcq"){const ok=resp===q.correct;return{resp,ok,yours:ok?null:(q.choices.find(c=>c.id===resp)||{}).fb}}
  if(q.type==="tf"){return{resp,ok:(resp==="true")===q.correct}}
  const r=norm(resp);let ok=q.accepted.some(a=>norm(a)===r),typo=false;
  if(!ok&&q.accepted.some(a=>ratio(norm(a),r)>=.85)){ok=true;typo=true}
  let yours=null;if(!ok){const h=TERMS.find(t=>ratio(norm(t[0]),r)>=.85&&!q.accepted.includes(norm(t[0])));if(h)yours=`${h[0]}: ${h[1]}.`}
  return{resp,ok,typo,yours}}
const answerText=q=>q.type==="mcq"?q.choices.find(c=>c.id===q.correct).text:q.type==="tf"?(q.correct?"True":"False"):q.answer;

function fbHTML(q,a){
  return `<div class="fb" id="fb" tabindex="-1">
    <div class="vline">${a.ok?`<span class="verdict ok">${ic("check")}Correct</span>`:`<span class="verdict bad">${ic("x")}Wrong</span><span>Answer: <b>${esc(answerText(q))}</b></span>`}
      ${a.typo?`<span class="muted" style="font-size:13px">Spelled “${esc(q.answer)}”</span>`:""}</div>
    ${q.changed?`<p class="diff"><del>${esc(q.changed.to)}</del> → <ins>${esc(q.changed.from)}</ins></p>`:""}
    <p>${esc(q.why)}</p>
    ${!a.ok&&a.yours?`<p class="why2">${esc(a.yours)}</p>`:""}
    <details class="src"><summary>${ic("chev")}Source · ${esc(q.src.at)}</summary><blockquote>${esc(q.src.quote)}</blockquote></details>
  </div>`;
}
function mapHTML(A){return `<div class="map">${A.order.map((id,i)=>{const a=A.ans[id];return `<button class="cell ${a?(a.ok?"c-ok":"c-bad"):""} ${i===A.idx?"c-cur":""}" data-act="jump" data-i="${i}" aria-label="Card ${i+1}, ${a?(a.ok?"correct":"wrong"):"not answered"}">${i+1}</button>`}).join("")}</div>
  <div class="legend"><span><i class="ok"></i>Right</span><span><i class="bad"></i>Wrong</span><span><i class="un"></i>Open</span></div>`}

function vCards(){

  else if(q.type==="tf"){const b=(v,w)=>{let cls="";if(a){const right=(v==="true")===q.correct;cls=right?"is-correct":(a.resp===v?"is-wrong":"is-dim")}return `<button class="tfb ${cls}" data-act="pick" data-v="${v}" ${a?"disabled":""}>${w}</button>`};
    body=`<div class="tf">${b("true","True")}${b("false","False")}</div>`}

function vResults(){
  const A=S.attempt,t=tally(A),n=A.order.length;
  const wrong=A.order.filter(id=>A.ans[id]&&!A.ans[id].ok),open=A.order.filter(id=>!A.ans[id]),miss=wrong.length+open.length;
  const s=stats(rv()),left=Math.max(0,s.unused-10);
  const item=(id,kind)=>{const q=Q[id],a=A.ans[id];const yours=a?(q.type==="mcq"?q.choices.find(c=>c.id===a.resp).text:q.type==="tf"?(a.resp==="true"?"True":"False"):a.resp):"—";
    return `<details><summary>${ic(kind==="bad"?"x":"dash")}<span>${fmt(q.prompt)}</span>${ic("chev")}</summary>
      <div class="body"><p>Answer: <b>${esc(answerText(q))}</b>${a?` <span class="muted">· yours: ${esc(yours)}</span>`:""}</p><p>${esc(q.why)}</p><p class="muted">${esc(q.src.at)}</p></div></details>`};
  return `<p class="label">Set ${S.setNo}${A.kind==="mistakes"?" · mistakes":""}</p>
    <div class="score">${pad(t.ok)}<span>/${pad(n)}</span></div>
    <div class="strip" role="img" aria-label="${t.ok} right, ${t.bad} wrong, ${t.un} skipped">${A.order.map(id=>{const a=A.ans[id];return `<i class="${a?(a.ok?"ok":"bad"):"un"}"></i>`}).join("")}</div>
    <div class="res-actions">
      <button class="btn ${miss?"primary":""}" data-act="retry" ${miss?"":"disabled"}>${ic("retry")}Retry ${miss||""} mistake${miss===1?"":"s"}</button>
      <button class="btn" data-act="restart">${ic("restart")}Restart</button>
      <button class="btn ${miss?"":"primary"}" data-act="newset" ${left?"":"disabled"}>${ic("plus")}New set</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="sheet" data-s="export-exam">${ic("down")}Export</button></div>
    ${miss?`<div class="ascii" aria-hidden="true">${"*".repeat(260)}</div>
    <div class="sec-head"><h2 class="sec"><span class="hl">Review</span></h2><span class="muted" style="font-size:13px">${miss}</span></div>
    <div class="review">${[...wrong.map(id=>item(id,"bad")),...open.map(id=>item(id,"open"))].join("")}</div>`:""}`;
}

/* ---------------- sheets ---------------- */
function sheetHTML(){
  const head=t=>`<div class="sheet-head"><h2 id="sh-h">${t}</h2><button class="icon-btn" data-act="close" aria-label="Close">${ic("x")}</button></div>`;
  const r=rv(),o=S.opt;
  switch(S.sheet){
  case "start":{const mx=maxItems();o.count=Math.max(mx?1:0,Math.min(o.count,mx));
    const tile=(k,g)=>`<button class="type" data-act="type" data-k="${k}" aria-pressed="${o.types.has(k)}"><span class="g">${g}</span><span class="n">${TYPE[k]}</span></button>`;
    const files=r.files.filter(f=>FILES[f].status==="ready").map(f=>{const F=FILES[f],sf=o.files[f]||(o.files[f]={on:true,from:"",to:""});
      return `<div class="sf"><input type="checkbox" id="sf-${f}" data-f="${f}" ${sf.on?"checked":""}><label for="sf-${f}">${esc(F.name)}</label>
        <div class="range">${F.unit==="slides"?"Slides":"Pages"} <input id="fr-${f}" inputmode="numeric" placeholder="1" value="${esc(sf.from)}" data-f="${f}" data-k="from" aria-label="From"> – <input id="to-${f}" inputmode="numeric" placeholder="${F.pages}" value="${esc(sf.to)}" data-f="${f}" data-k="to" aria-label="To"></div></div>`}).join("");
    const topics=r.topics.length?`<div class="chips">${r.topics.map(t=>`<button class="chip" data-act="topic" data-t="${esc(t[0])}" aria-pressed="${o.topics.has(t[0])}">${esc(t[0])}</button>`).join("")}</div>`:"";
    return head("New exam")+`
      <div class="field"><span class="label">Type</span><div class="types">${tile("mcq","ABCD")}${tile("tf","T/F")}${tile("ident","___")}</div></div>
      <div class="field"><span class="label">Items</span><div class="count-row"><div class="stepper"><button data-act="dec" aria-label="Fewer" ${o.count<=1?"disabled":""}>${ic("dash")}</button><input id="count" inputmode="numeric" value="${o.count}" aria-label="Number of items"><button data-act="inc" aria-label="More" ${o.count>=mx?"disabled":""}>${ic("plus")}</button></div><span class="muted">/ ${mx}</span></div></div>
      <details class="more" id="more" ${S.moreOpen?"open":""}><summary>${ic("chev")}Choose slides or topics</summary><div class="scope">${files}${topics}</div></details>
      <button class="btn primary big block" data-act="generate" ${!o.types.size||!mx?"disabled":""}>${ic("play")}Start</button>`;}
  case "create":
    return head("New reviewer")+`
      <button class="drop" data-act="pickfiles">${ic("up")}<b>Add files</b><span class="muted" style="font-size:12px">PDF · PPTX · PPT</span></button>
      ${S.upload.length?`<div>${S.upload.map(u=>`<div class="up">${ic("file")}<span>${esc(u.name)}</span><span class="muted">${u.state}</span></div>`).join("")}</div>
        <input class="input" id="rvname" value="${esc(S.upload[0].name.replace(/\.\w+$/,""))}" aria-label="Reviewer name">`:""}
      <p class="fine">Files are read by Gemini (free tier). Avoid private files.</p>
      <button class="btn primary big block" data-act="create" ${S.upload.length&&S.upload.every(u=>u.state!=="Reading…")?"":"disabled"}>Create</button>`;
  case "add":
    return head("Add file")+`<button class="drop" data-act="addfile">${ic("up")}<b>Add files</b><span class="muted" style="font-size:12px">PDF · PPTX · PPT</span></button><p class="fine">Files are read by Gemini (free tier). Avoid private files.</p>`;
  case "export-rv":
    return head("Export")+`<div class="menu"><button data-act="dl" data-f="study-sheet.pdf">${ic("down")}Study sheet<span class="muted">PDF</span></button><button data-act="dl" data-f="anki.csv">${ic("down")}Flashcards<span class="muted">Anki CSV</span></button></div>`;
  case "export-exam":
    return head("Export")+`<div class="menu"><button data-act="dl" data-f="exam.pdf">${ic("down")}Printable exam<span class="muted">PDF</span></button><button data-act="dl" data-f="exam-anki.csv">${ic("down")}Flashcards<span class="muted">Anki CSV</span></button></div>`;
  case "more":
    return head(esc(r.title))+`<div class="menu"><button data-act="dl" data-f="rename">${ic("edit")}Rename</button><button data-act="ask-reset" ${stats(r).used?"":"disabled"}>${ic("reset")}Reset progress</button><button data-act="dl" data-f="delete">${ic("trash")}Delete</button></div>`;
  case "reset":
    return head("Reset progress?")+`<p>All ${stats(r).items} items become new again. Scores stay.</p><div class="row"><button class="btn primary" data-act="reset-yes">Reset</button><button class="btn" data-act="close">Cancel</button></div>`;
  case "map":return head("Cards")+mapHTML(S.attempt)+`<button class="btn block" data-act="finish">Finish</button>`;
  case "exit":{const t=tally(S.attempt);return head("Exit?")+`<div class="menu">
      <button data-act="finish-now">${ic("check")}Finish now${t.un?`<span class="muted">${t.un} open = wrong</span>`:""}</button>
      <button data-act="save-exit">${ic("back")}Save &amp; exit</button>
      <button data-act="close">${ic("play")}Keep going</button></div>`;}
  case "finish":{const t=tally(S.attempt);return head("Finish?")+`<p>${t.un} open card${t.un>1?"s":""} will count as wrong.</p><div class="row"><button class="btn primary" data-act="goto-open">Answer them</button><button class="btn" data-act="finish-now">Finish</button></div>`;}
  }
  return "";
}
function overlay(){const o=$("#overlay");if(!S.sheet){o.innerHTML="";return}
  o.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h">${sheetHTML()}</div></div>`;
  if(fine){const f=o.querySelector(".sheet .icon-btn");f&&f.focus({preventScroll:true})}}

/* ---------------- render / nav ---------------- */
function render(focusFb){
  document.body.classList.toggle("fit",S.view==="cards");
  header();
  $("#view").innerHTML=S.view==="home"?vHome():S.view==="reviewer"?vReviewer():S.view==="gen"?vGen():S.view==="cards"?vCards():vResults();
  overlay();
  if(S.view==="gen")runGen();
  if(S.view==="cards"){const i=$("#identIn");if(i&&fine)i.focus();if(focusFb){const fb=$("#fb");if(fb){fb.scrollIntoView({block:"nearest",behavior:reduced?"auto":"smooth"});fb.focus({preventScroll:true})}}}
}
function go(v){S.sheet=null;S.view=v;render();window.scrollTo(0,0)}
function sample(){const A=newAttempt(Object.keys(Q),"full");Object.entries({q1:"c1",q2:"false",q3:"Chlorophyl",q4:"c2",q5:"true",q6:"Krebs cycle",q7:"c1",q8:"false",q9:"Stomata"}).forEach(([id,r])=>A.ans[id]=grade(id,r));A.done=true;return A}
function pick(v){const A=S.attempt,[id]=cur();if(A.ans[id])return;A.ans[id]=grade(id,v);if(firstOpen(A)===-1)A.done=true;render(true)}
function next(){const A=S.attempt;if(A.done){go("results");return}A.idx=A.idx<A.order.length-1?A.idx+1:firstOpen(A);render();const c=$("#card");if(c)c.scrollTop=0}
function skip(){const A=S.attempt;if(A.idx<A.order.length-1)A.idx++;else{const u=firstOpen(A);if(u===-1||u===A.idx){toast("Last open card");return}A.idx=u}render()}

function act(a,el){const A=S.attempt;switch(a){
  case "theme":setTheme(isDark()?"light":"dark");header();break;
  case "go":go(el.dataset.v);break;
  case "open":S.rid=el.dataset.id;S.opt.files={};S.opt.topics=new Set();go("reviewer");break;
  case "sheet":S.sheet=el.dataset.s;S.moreOpen=false;overlay();break;
  case "close":case "scrim":S.sheet=null;overlay();break;
  case "type":{const k=el.dataset.k;S.opt.types.has(k)?S.opt.types.delete(k):S.opt.types.add(k);overlay();break}
  case "inc":S.opt.count++;overlay();break;
  case "dec":S.opt.count=Math.max(1,S.opt.count-1);overlay();break;
  case "topic":{const t=el.dataset.t;S.opt.topics.has(t)?S.opt.topics.delete(t):S.opt.topics.add(t);S.moreOpen=true;overlay();break}
  case "generate":go("gen");break;
  case "pickfiles":{if(S.upload.length){toast("Already uploaded · reused");break}
    S.upload=[{name:"Week 4 – Plant Hormones.pdf",state:"Reading…"}];overlay();
    setTimeout(()=>{S.upload[0].state="Ready";if(S.sheet==="create")overlay()},reduced?200:1400);break}
  case "addfile":toast("Added · reading…");S.sheet=null;overlay();break;
  case "create":{const name=($("#rvname")||{}).value||"New reviewer";FILES.f6={name:"Week 4 – Plant Hormones.pdf",pages:16,unit:"pages",status:"ready",items:19,used:0,defs:9};
    REV.plant={title:name,files:["f6"],last:"—",topics:[],exams:[]};S.upload=[];S.rid="plant";go("reviewer");break}
  case "dl":toast(`Prototype · ${el.dataset.f}`);break;
  case "ask-reset":S.sheet="reset";overlay();break;
  case "reset-yes":rv().files.forEach(f=>FILES[f].used=0);go("reviewer");toast("Progress reset");break;
  case "past":S.attempt=sample();S.setNo=+el.dataset.set;go("results");break;
  case "pick":pick(el.dataset.v);break;
  case "next":next();break;
  case "skip":skip();break;
  case "back":if(A&&A.idx>0){A.idx--;render()}break;
  case "jump":A.idx=+el.dataset.i;S.sheet=null;render();break;
  case "finish":if(A.done||!tally(A).un)go("results");else{S.sheet="finish";overlay()}break;
  case "goto-open":A.idx=firstOpen(A);S.sheet=null;render();break;
  case "finish-now":A.done=true;go("results");break;
  case "save-exit":go("reviewer");toast("Saved · continue anytime");break;
  case "retry":{const ids=A.order.filter(id=>!A.ans[id]||!A.ans[id].ok);S.attempt=newAttempt(ids,"mistakes");go("cards");break}
  case "restart":S.attempt=newAttempt(A.order,"full");go("cards");break;
  case "newset":S.setNo++;go("gen");break;
}}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;if(el.dataset.act==="scrim"&&e.target!==el)return;act(el.dataset.act,el)});
document.addEventListener("change",e=>{const el=e.target;
  if(el.id==="count"){S.opt.count=Math.max(1,parseInt(el.value,10)||1);overlay()}
  else if(el.matches(".sf input[type=checkbox]")){S.opt.files[el.dataset.f].on=el.checked;S.moreOpen=true;overlay()}
  else if(el.matches(".range input")){S.opt.files[el.dataset.f][el.dataset.k]=el.value.replace(/\D/g,"");S.moreOpen=true;overlay()}});
document.addEventListener("toggle",e=>{if(e.target.id==="more")S.moreOpen=e.target.open},true);
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="identForm"){const v=$("#identIn").value.trim();if(v)pick(v);else $("#identIn").focus()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.sheet){S.sheet=null;overlay();return}
  if(S.view!=="cards"||S.sheet||e.metaKey||e.ctrlKey||e.altKey||e.target.tagName==="INPUT")return;
  const A=S.attempt,[id,q]=cur(),a=A.ans[id],k=e.key.toLowerCase();
  if(e.key==="Enter"&&a){e.preventDefault();next();return}
  if(e.key==="ArrowLeft"){act("back");return}
  if(e.key==="ArrowRight"){a?next():skip();return}
  if(a)return;
  if(q.type==="mcq"){const i="abcd".indexOf(k)>=0?"abcd".indexOf(k):"1234".indexOf(k);if(i>=0)pick(A.co[id][i])}
  if(q.type==="tf"&&(k==="t"||k==="f"))pick(k==="t"?"true":"false");
});
render();
</script>
